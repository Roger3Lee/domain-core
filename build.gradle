plugins {
    id 'java'
    id 'io.github.gradle-nexus.publish-plugin' version '2.0.0'
}

group = 'io.github.roger3lee'
version = '3.0.3'

repositories {
    maven { url 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public/' }
    mavenLocal()
    mavenCentral()
}

subprojects {
    if (project.name == 'domain-dependencies') {
        return
    }

    apply plugin: 'java'

    repositories {
        maven { url 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public/' }
        mavenLocal()
        mavenCentral()
    }

    sourceCompatibility = '21'
    targetCompatibility = '21'

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}

// ========== Maven Central 鍙戝竷閰嶇疆 ==========
subprojects { subProj ->
    // 璺宠繃涓嶉渶瑕佸彂甯冪殑妯″潡
    if (project.name in ['domain-dependencies', 'domain-generator', 'domain-generator-v2', 'domain-sample',
                         'domain-generator-idea-plugin', 'domain-web-generator',
                         'domain-polardb-support', 'domain-oracle-support']) {
        return
    }

    apply plugin: 'maven-publish'
    apply plugin: 'signing'

    // 婧愮爜 jar 浠诲姟
    task sourceJar(type: Jar) {
        archiveClassifier = 'sources'
        from sourceSets.main.allSource
    }

    // javadoc jar 浠诲姟
    task javadocJar(type: Jar) {
        archiveClassifier = 'javadoc'
        from javadoc.destinationDir
    }

    // javadoc 缂栫爜璁剧疆
    javadoc {
        options.encoding = 'UTF-8'
        if (JavaVersion.current().isJava9Compatible()) {
            options.addBooleanOption('html5', true)
        }
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                from components.java

                // 闄勫甫婧愮爜 jar
                artifact sourceJar
                // 闄勫甫 javadoc jar
                artifact javadocJar

                pom {
                    name = project.name
                    description = 'Domain-Driven Design (DDD) scaffolding framework'
                    url = 'https://github.com/roger3lee/domain-core'

                    licenses {
                        license {
                            name = 'The Apache License, Version 2.0'
                            url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                        }
                    }

                    developers {
                        developer {
                            id = 'roger3lee'
                            name = 'roger3lee'
                            email = 'roger3lee@gmail.com'
                        }
                    }

                    scm {
                        connection = 'scm:git:git://github.com/roger3lee/domain-core.git'
                        developerConnection = 'scm:git:ssh://github.com/roger3lee/domain-core.git'
                        url = 'https://github.com/roger3lee/domain-core'
                    }
                }
            }
        }

        // nexus-publish-plugin 鑷�姩娣诲姞 sonatype 浠撳簱锛屾棤闇€鎵嬪姩閰嶇疆
    }

    signing {
        sign publishing.publications.mavenJava
    }
}

// ========== Nexus Publish 鎻掍欢閰嶇疆锛堣嚜鍔ㄥ垱寤恒€佸叧闂�拰鍙戝竷 staging 浠撳簱锛?==========
nexusPublishing {
    repositories {
        sonatype {
            nexusUrl.set(uri("https://ossrh-staging-api.central.sonatype.com/service/local/"))
            snapshotRepositoryUrl.set(uri("https://central.sonatype.com/repository/maven-snapshots/"))
            username = findProperty("ossrhUsername") ?: System.getenv("OSSRH_USERNAME")
            password = findProperty("ossrhPassword") ?: System.getenv("OSSRH_PASSWORD")
        }
    }
}
