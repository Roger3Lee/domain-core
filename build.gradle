plugins {
    id 'java'
    id 'io.github.gradle-nexus.publish-plugin' version '2.0.0'
}

group = 'io.github.roger3lee'
version = '3.0.7'

repositories {
    maven { url 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public/' }
    mavenLocal()
    mavenCentral()
}

subprojects {
    if (project.name == 'domain-dependencies') {
        return
    }

    apply plugin: 'java'

    repositories {
        maven { url 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public/' }
        mavenLocal()
        mavenCentral()
    }

    sourceCompatibility = '21'
    targetCompatibility = '21'

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}

// ========== Maven Central 閸欐垵绔烽柊宥囩�?==========
subprojects { subProj ->
    // 鐠哄疇绻冩稉宥夋付鐟曚礁褰傜敮鍐畱濡€虫�?
    if (project.name in ['domain-dependencies', 'domain-generator', 'domain-generator-v2', 'domain-sample',
                         'domain-generator-idea-plugin', 'domain-web-generator',
                         'domain-polardb-support', 'domain-oracle-support']) {
        return
    }

    apply plugin: 'maven-publish'
    apply plugin: 'signing'

    // 濠ф劗�?jar 娴犺濮?
    task sourceJar(type: Jar) {
        archiveClassifier = 'sources'
        from sourceSets.main.allSource
    }

    // javadoc jar 娴犺濮?
    task javadocJar(type: Jar) {
        archiveClassifier = 'javadoc'
        from javadoc.destinationDir
    }

    // javadoc 缂傛牜鐖滅拋鍓х枂
    javadoc {
        options.encoding = 'UTF-8'
        if (JavaVersion.current().isJava9Compatible()) {
            options.addBooleanOption('html5', true)
        }
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                from components.java

                // 闂勫嫬鐢┃鎰�?jar
                artifact sourceJar
                // 闂勫嫬鐢?javadoc jar
                artifact javadocJar

                pom {
                    name = project.name
                    description = 'Domain-Driven Design (DDD) scaffolding framework'
                    url = 'https://github.com/roger3lee/domain-core'

                    licenses {
                        license {
                            name = 'The Apache License, Version 2.0'
                            url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                        }
                    }

                    developers {
                        developer {
                            id = 'roger3lee'
                            name = 'roger3lee'
                            email = 'roger3lee@gmail.com'
                        }
                    }

                    scm {
                        connection = 'scm:git:git://github.com/roger3lee/domain-core.git'
                        developerConnection = 'scm:git:ssh://github.com/roger3lee/domain-core.git'
                        url = 'https://github.com/roger3lee/domain-core'
                    }
                }
            }
        }

        // nexus-publish-plugin 閼凤拷濮╁ǎ璇插 sonatype 娴犳挸绨遍敍灞炬￥闂団偓閹靛濮╅柊宥囩�?
    }

    signing {
        sign publishing.publications.mavenJava
    }
}

// ========== Nexus Publish 閹绘帊娆㈤柊宥囩枂閿涘牐鍤滈崝銊ュ灡瀵ゆ亽鈧礁鍙ч梻锟芥嫲閸欐垵�?staging 娴犳挸绨遍敍?==========
nexusPublishing {
    repositories {
        sonatype {
            nexusUrl.set(uri("https://ossrh-staging-api.central.sonatype.com/service/local/"))
            snapshotRepositoryUrl.set(uri("https://central.sonatype.com/repository/maven-snapshots/"))
            username = findProperty("ossrhUsername") ?: System.getenv("OSSRH_USERNAME")
            password = findProperty("ossrhPassword") ?: System.getenv("OSSRH_PASSWORD")
        }
    }
}
